# =====================================================================
#  Build & Push – Suricata Hardened
#  Multi-stage FROM scratch → ghcr.io + Docker Hub
#  Lint + Build + Sign (cosign OIDC) + Scan (Trivy) + Release
# =====================================================================
name: build-push

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - 'versions.json'
      - '.github/workflows/build-push.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  NAMESPACE: ${{ github.repository_owner }}
  IMAGE_NAME: suricata-hardened

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write
  attestations: write

jobs:
  # -------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./scripts

  # -------------------------------------------------------------------
  #  Builds the image once. On a real push/tag (never on pull_request --
  #  fork PRs must not get registry credentials) it's pushed BY DIGEST, so
  #  `test` below can pull back that exact digest and run the functional
  #  tests against those literal bytes -- not a separately-built image that
  #  "should" match thanks to cache. `promote` re-tags/signs/scans that
  #  same digest; nothing gets rebuilt between "tested" and "shipped". On a
  #  PR there's no registry to push to, so the image is instead exported to
  #  a local tarball and handed to `test` (a separate job/runner) as an
  #  artifact.
  # -------------------------------------------------------------------
  build:
    name: Build image
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Make room for local tarball export (PR only)
        if: env.PUBLISH != 'true'
        run: mkdir -p /tmp/image-tar

      - name: Build (push-by-digest, or local tarball on PR)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0}/{1}/{2},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.NAMESPACE, env.IMAGE_NAME) || 'type=docker,dest=/tmp/image-tar/image.tar' }}
          tags: ${{ env.PUBLISH != 'true' && format('{0}:latest', env.IMAGE_NAME) || '' }}
          sbom: ${{ env.PUBLISH }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          cache-from: type=gha,scope=suricata
          cache-to: type=gha,mode=max,scope=suricata

      - name: Upload image tarball (PR only, for the test job)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: image-tar
          path: /tmp/image-tar/image.tar
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------------
  #  Loads the exact bytes `build` just produced (pulled by digest from
  #  the registry, or loaded from its tarball artifact on a PR) and runs
  #  the functional tests against them.
  # -------------------------------------------------------------------
  test:
    name: Functional tests
    needs: build
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7

      - name: Login ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull built digest for testing
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          docker pull "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}"
          docker tag  "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}" "${{ env.IMAGE_NAME }}:latest"

      - name: Download image tarball (PR only)
        if: env.PUBLISH != 'true'
        uses: actions/download-artifact@v8
        with:
          name: image-tar
          path: /tmp/image-tar

      - name: Load image tarball (PR only)
        if: env.PUBLISH != 'true'
        run: docker load -i /tmp/image-tar/image.tar

      - name: Build & start stack
        run: docker compose up -d --no-build suricata

      - name: Wait for healthy
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' suricata-hardened 2>/dev/null || echo "starting")
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "::error::suricata-hardened did not become healthy in time"
          docker compose logs
          exit 1

      # A version tag that does not match the binary inside is the one
      # failure nothing else here catches: php shipped 8.5.8 under an 8.5.9
      # tag for 18 days because only the FROM tag was rewritten, never the
      # digest. Ask the built image what it is, and refuse to publish if it
      # disagrees with what we are about to call it.
      - name: Assert the image is the Suricata version we tag it with
        run: |
          set -euo pipefail
          want=$(jq -r .suricata versions.json)
          # Capture the probe before extracting: a dead container or a
          # changed banner would otherwise fail the pipeline under
          # `set -e` before a single diagnostic line is printed.
          raw=$(docker exec suricata-hardened suricata -V 2>&1 || true)
          got=$(printf '%s' "$raw" | grep -oP 'Suricata version \K[0-9][0-9.]*' || true)
          echo "declared: ${want} | image: ${got:-<no version parsed>}"
          if [ "$want" != "$got" ]; then
            echo "::error::image ships Suricata ${got:-<unknown>} but would be published as ${want}"
            printf 'probe output:\n%s\n' "$raw" | head -5
            exit 1
          fi

      - name: Run smoke tests
        run: ./scripts/test-alerts.sh suricata-hardened

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs

      - name: Teardown
        if: always()
        run: docker compose down -v

  # -------------------------------------------------------------------
  #  Re-tags the exact digest `build` pushed and `test` just verified --
  #  no rebuild.
  # -------------------------------------------------------------------
  promote:
    name: Promote tested digest
    needs: [build, test]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}

    steps:
      # fetch-depth 0: build-revision.sh counts commits, a shallow clone
      # would silently make every build .0
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read versions
        id: versions
        run: |
          set -euo pipefail
          SURICATA_VER=$(jq -r '.suricata' versions.json)
          echo "suricata=${SURICATA_VER}" >> "$GITHUB_OUTPUT"
          echo "### Resolved versions" >> "$GITHUB_STEP_SUMMARY"
          echo "- Suricata: ${SURICATA_VER}" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker Hub credentials
        id: dockerhub
        run: |
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login Docker Hub
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute Docker Hub image name
        id: dockerhub-image
        if: steps.dockerhub.outputs.available == 'true'
        env:
          DOCKERHUB_NS: ${{ secrets.DOCKERHUB_USERNAME }}
        run: echo "image=docker.io/${DOCKERHUB_NS}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Compute build revision
        id: revision
        run: |
          set -euo pipefail
          VERSION="${{ steps.versions.outputs.suricata }}"
          REVISION=$(./scripts/build-revision.sh suricata Dockerfile scripts/ versions.json)
          echo "tag=${VERSION}.${REVISION}" >> "$GITHUB_OUTPUT"
          echo "- Build revision: ${VERSION}.${REVISION}" >> "$GITHUB_STEP_SUMMARY"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
            ${{ steps.dockerhub-image.outputs.image }}
          tags: |
            type=raw,value=${{ steps.revision.outputs.tag }}
            type=semver,pattern={{version}}
            type=raw,value=${{ steps.versions.outputs.suricata }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create tags on the tested digest (no rebuild)
        id: manifest
        run: |
          set -euo pipefail
          SOURCE="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}"
          TAGS=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && TAGS="${TAGS} -t ${tag}"
          done <<< "${{ steps.meta.outputs.tags }}"
          docker buildx imagetools create ${TAGS} "${SOURCE}"
          DIGEST=$(docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.versions.outputs.suricata }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (OIDC keyless)
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          HAS_DOCKERHUB: ${{ steps.dockerhub.outputs.available }}
          DOCKERHUB_NS: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}@${DIGEST}"
          if [ "$HAS_DOCKERHUB" = "true" ]; then
            COSIGN_REPOSITORY="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}" \
              cosign sign --yes "docker.io/${DOCKERHUB_NS}/${{ env.IMAGE_NAME }}@${DIGEST}"
          fi

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}@${{ steps.manifest.outputs.digest }}
          format: sarif
          output: trivy-suricata.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-suricata.sarif
          category: suricata

      - name: GitHub SLSA Attestation
        if: "!startsWith(github.ref, 'refs/heads/dependabot/')"
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          HAS_DOCKERHUB: ${{ steps.dockerhub.outputs.available }}
          DOCKERHUB_NS: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "### suricata-hardened" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.manifest.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          if [ "$HAS_DOCKERHUB" = "true" ]; then
            echo "docker pull docker.io/${DOCKERHUB_NS}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

  # -------------------------------------------------------------------
  # -------------------------------------------------------------------
  #  Le README nomme le tag immuable courant. On le regenere ici pour que la
  #  doc ne puisse jamais designer un tag que les registres ne portent plus.
  # -------------------------------------------------------------------
  update-readme:
    name: Refresh README tag block
    needs: promote
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # fetch-depth 0: build-revision.sh counts commits, a shallow clone
      # would silently make every image .0
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Rewrite tag block
        run: |
          set -euo pipefail
          VERSION=$(jq -r .suricata versions.json)
          REVISION=$(./scripts/build-revision.sh suricata Dockerfile scripts/ versions.json)
          ./scripts/update-readme-tags.sh "jbsky/suricata-hardened=${VERSION}=${VERSION}.${REVISION}"

      - name: Commit if changed
        run: |
          set -euo pipefail
          # `git diff --quiet && exit 0` would abort the step under `set -e`
          # on the branch where there IS a change: use an explicit if.
          if git diff --quiet README.md; then
            echo "README already names the current tag"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(readme): tag immuable courant [skip ci]"
          # A concurrent publish may have landed first: rebase and retry
          # rather than fail the run over a race.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase origin main || true
          done
          exit 1

  cleanup:
    name: Prune old registry tags
    needs: promote
    uses: ./.github/workflows/registry-cleanup.yml
    secrets: inherit

  # -------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: promote
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Tarball + checksums
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          tar --exclude='.git' --exclude='dist' \
              -czf "dist/suricata-hardened-${VERSION}.tar.gz" \
              --transform "s,^,suricata-hardened-${VERSION}/," \
              $(ls -A | grep -v -E '^(\.git|dist)$')
          cd dist
          sha256sum "suricata-hardened-${VERSION}.tar.gz" > "suricata-hardened-${VERSION}.sha256"
          sha512sum "suricata-hardened-${VERSION}.tar.gz" > "suricata-hardened-${VERSION}.sha512"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/suricata-hardened-${{ github.ref_name }}.tar.gz
            dist/suricata-hardened-${{ github.ref_name }}.sha256
            dist/suricata-hardened-${{ github.ref_name }}.sha512
